# fetch_rest job. Calls each REST API in fetch_rest/settings/ and writes the
# response into the inbox, where file_router and the ingest job take over.
# Per-workspace values (catalog prefix, environment, git branch or commit) come
# from the targets in databricks.yml.
resources:
  jobs:
    fetch_rest:
      name: fetch_rest
      max_concurrent_runs: 1
      queue:
        enabled: true
      # Daily, off the hour. Every source is fetched at this one time.
      # Paused in free (fetch_pause_status in databricks.yml); run it by hand there.
      schedule:
        quartz_cron_expression: "0 17 4 * * ?"
        timezone_id: America/Chicago
        pause_status: ${var.fetch_pause_status}
      # catalog_prefix picks the inbox (/Volumes/<prefix>utility/raw/inbox/).
      # environment selects settings whose "environments" list includes it.
      parameters:
        - name: catalog_prefix
          default: ${var.catalog_prefix}
        - name: environment
          default: ${var.environment}
      tasks:
        - task_key: task_values
          notebook_task:
            notebook_path: fetch_rest/task_values
            source: GIT
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: fetch_loop
          depends_on:
            - task_key: task_values
          for_each_task:
            inputs: "{{tasks.task_values.values.fetch}}"
            concurrency: 4
            task:
              task_key: fetch_iteration
              notebook_task:
                notebook_path: fetch_rest/fetch
                base_parameters:
                  task_config: "{{input}}"
                source: GIT
              min_retry_interval_millis: 900000
              disable_auto_optimization: true
              environment_key: Default
      # Code is pulled from git on every run, from origin of the checkout you
      # deploy from. Each target in databricks.yml adds git_branch or git_commit.
      git_source:
        git_url: ${bundle.git.origin_url}
        git_provider: ${var.git_provider}
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
