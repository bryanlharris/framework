# Databricks Asset Bundle: defines the ingest, file_router, fetch_url,
# fetch_sftp and fetch_rest jobs for every workspace. Deploy with:
#   databricks bundle deploy -t <target>
#
# The bundle creates and updates the jobs and, in free, test and dev,
# the schemas and volumes; catalogs are always made by hand. The jobs
# always pull their code from GitHub when they run (git_source), never
# from this checkout.
#
# Each target is one workspace, named by a CLI profile in ~/.databrickscfg
# (which holds the host, so no host is written here), and states everything
# that differs there; test is a second target in free's workspace. See
# doc/environments.md for the prefix and environment table, and
# doc/procedures/git_workflow.md for branches and tags.

bundle:
  name: framework

include:
  - resources/*.yml

# Jobs pull from GitHub, so don't upload this checkout to the workspace.
# This makes validate and deploy warn "There are no files to sync"; that
# warning is expected.
sync:
  exclude:
    - "*"

variables:
  catalog_prefix:
    description: Put in front of catalog names. dev_, staging_, or empty in prod and free.
  environment:
    description: free, test, dev, staging or prod. Selects settings by their "environments" list.
  git_provider:
    description: gitHub for github.com, or gitHubEnterprise for a GitHub Enterprise server.
  fetch_pause_status:
    description: PAUSED or UNPAUSED, for the fetch jobs' daily schedules. Paused jobs can still be run by hand.
  job_name_prefix:
    description: Put in front of job names. "[test] " in the test target, so its jobs stand apart from free's.
    default: ""

targets:

  free:
    # No default target: every bundle command names one with -t, so a
    # command can't land on a workspace by accident.
    workspace:
      profile: DEFAULT
    variables:
      catalog_prefix: ""
      environment: free
      fetch_pause_status: PAUSED
      git_provider: gitHub
    resources:
      jobs:
        ingest:
          git_source:
            git_branch: master
        file_router:
          git_source:
            git_branch: master
        fetch_url:
          git_source:
            git_branch: master
        fetch_sftp:
          git_source:
            git_branch: master
        fetch_rest:
          git_source:
            git_branch: master

  # Test copy of free, in the same workspace: its own jobs ("[test] ..."),
  # catalogs (test_...) and state. The bundle also creates its schemas and
  # volumes, to try bundle management safely (doc/planning/decisions.md). Its catalogs
  # are made by hand: free's Default Storage catalogs can only be created
  # in the UI (or SQL), not by the bundle.
  test:
    workspace:
      profile: DEFAULT
    variables:
      catalog_prefix: test_
      environment: test
      job_name_prefix: "[test] "
      fetch_pause_status: PAUSED
      git_provider: gitHub
    resources:
      # The jobs pull whatever branch is checked out where you deploy from
      # (local checkout or the workspace Git folder).
      jobs:
        ingest:
          git_source:
            git_branch: ${bundle.git.branch}
          # Same path as resources/ingest.job.yml, written as a reference so
          # the bundle creates the volume before the job (its trigger needs it).
          trigger:
            file_arrival:
              url: /Volumes/${resources.volumes.raw_files.catalog_name}/${resources.volumes.raw_files.schema_name}/${resources.volumes.raw_files.name}/
        file_router:
          git_source:
            git_branch: ${bundle.git.branch}
          trigger:
            file_arrival:
              url: /Volumes/${resources.volumes.raw_inbox.catalog_name}/${resources.volumes.raw_inbox.schema_name}/${resources.volumes.raw_inbox.name}/
        fetch_url:
          git_source:
            git_branch: ${bundle.git.branch}
        fetch_sftp:
          git_source:
            git_branch: ${bundle.git.branch}
        fetch_rest:
          git_source:
            git_branch: ${bundle.git.branch}

  # Work workspaces. Each needs its profile (dev, staging, prod) in
  # ~/.databrickscfg on the machine you deploy from. Dev's schemas and volumes are bundle-managed
  # like free's; if they already exist there, bind them first
  # (doc/procedures/bundle_deploy.md "Bind Existing Schemas and Volumes"). Catalogs are made by hand.
  #
  # Dev has no prevent_destroy, so bundle destroy -t dev can wipe it
  # (doc/planning/decisions.md 1).
  #
  # Schema and volume keys are their real names with _ for the dots
  # (dev_utility_bronze is dev_utility.bronze), so plan and destroy
  # output says which catalog it means. Free and prod keep the short
  # keys (utility_bronze, raw_inbox): their real names have no prefix.
  #
  # The jobs pull the exact commit you deploy from (git_commit). Deploy
  # only from a clean checkout of a tag (dev_v0.NNN, staging_v0.NN,
  # prod_v0.N), from the CLI: doc/procedures/git_workflow.md.

  dev:
    workspace:
      profile: dev
    variables:
      catalog_prefix: dev_
      environment: dev
      fetch_pause_status: PAUSED
      git_provider: gitHub
    resources:
      jobs:
        ingest:
          git_source:
            git_commit: ${bundle.git.commit}
          trigger:
            file_arrival:
              url: /Volumes/${resources.volumes.dev_utility_raw_files.catalog_name}/${resources.volumes.dev_utility_raw_files.schema_name}/${resources.volumes.dev_utility_raw_files.name}/
        file_router:
          git_source:
            git_commit: ${bundle.git.commit}
          trigger:
            file_arrival:
              url: /Volumes/${resources.volumes.dev_utility_raw_inbox.catalog_name}/${resources.volumes.dev_utility_raw_inbox.schema_name}/${resources.volumes.dev_utility_raw_inbox.name}/
        fetch_url:
          git_source:
            git_commit: ${bundle.git.commit}
        fetch_sftp:
          git_source:
            git_commit: ${bundle.git.commit}
        fetch_rest:
          git_source:
            git_commit: ${bundle.git.commit}

  # staging and prod stay commented until they are wanted. To turn one on:
  # uncomment it here and its utility block in resources/utility.yml, add
  # its profile, and add dataset schemas when wanted (in each
  # resources/<dataset>.yml, copy dev's block, with this target's prefix on
  # catalogs and keys).

